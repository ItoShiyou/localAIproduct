[package]
name = "bizcard-logic"
version = "0.1.0"
edition = "2021"
description = "名刺管理: OCRロジックと Tauri 2 の殻"
publish = false

[lib]
name = "bizcard_logic"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bizcard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
factory-core = { path = "../core/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
tauri = { version = "2", features = [] }

[features]
default = ["tauri"]
# 実OCR(ONNX Runtime 上の PP-OCR)を使う評価用の例(examples/ocr_eval.rs)と測定に必要
onnx = ["factory-core/onnx"]
# Tauri 2 の包み(tauri_glue.rs、main.rs)。Mac(M2)で接続・確認済み(段階3)
tauri = []

[dev-dependencies]
csv = "1"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
