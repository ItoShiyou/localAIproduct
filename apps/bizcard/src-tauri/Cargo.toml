[package]
name = "bizcard-logic"
version = "0.1.0"
edition = "2021"
description = "名刺管理: OCRに依存しないロジック(ルール抽出・重複検知・CSV・DBスキーマ)。Tauri 2 の殻は未作成"
publish = false

[dependencies]
factory-core = { path = "../core/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[features]
# 実OCR(ONNX Runtime 上の PP-OCR)を使う評価用の例(examples/ocr_eval.rs)と測定に必要
onnx = ["factory-core/onnx"]

[dev-dependencies]
csv = "1"
encoding_rs = "0.8"
