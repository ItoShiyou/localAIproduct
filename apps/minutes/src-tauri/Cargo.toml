[package]
name = "minutes"
version = "0.1.0"
edition = "2021"
description = "議事録: 録音の読み込み・ノイズ除去・文字起こし・確認・書き出しと Tauri 2 の殻"
publish = false
default-run = "minutes"

[lib]
name = "minutes"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "minutes"
path = "src/main.rs"
required-features = ["tauri"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
factory-core = { path = "../core/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "adpcm"] }
nnnoiseless = { version = "0.5", default-features = false }
whisper-rs = { version = "0.15", optional = true }
rustfft = "6"
csv = "1"
base64 = "0.22"
hmac = "0.12"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"], optional = true }
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "std"], optional = true }
ndarray = { version = "0.17", optional = true }
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"

[features]
default = ["tauri", "whisper", "diarize"]
# Separate downloadable editions. No customer keys are required for these builds.
edition-free = []
edition-pro = []
tauri = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:keyring"]
# whisper.cpp(whisper-rs)による文字起こし。ビルドに cmake と C/C++ コンパイラが要る
whisper = ["dep:whisper-rs"]
# 話者の判別(ONNX Runtime 上の WeSpeaker)。実行時に onnxruntime の共有ライブラリを読み込む
diarize = ["dep:ort", "dep:ndarray"]
