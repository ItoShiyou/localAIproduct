<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ページが見つかりません</title>
  <!-- 404 は任意の階層で表示されるため、相対パスの CSS が使えない。ここだけ自己完結させる。 -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f3ef; color: #1d2220; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif; line-height: 1.9; letter-spacing: .03em; }
    main { max-width: 560px; padding: 24px; }
    .label { font: 700 12px/1.4 "Helvetica Neue", "Segoe UI", Arial, sans-serif; letter-spacing: .2em; color: #4d5450; display: flex; align-items: center; gap: 10px; }
    .label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #c27a1f; }
    h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.4; letter-spacing: .03em; margin: 12px 0 16px; }
    p { color: #4d5450; }
    a { color: #1d2220; font-weight: 700; text-underline-offset: .32em; }
    a:hover { color: #8c5810; }
  </style>
</head>
<body>
  <main>
    <p class="label">404 ・ Not found</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは、移動したか、まだ用意できていないようです。アドレスをご確認のうえ、トップからたどってみてください。</p>
    <p><a href="./">トップへ戻る</a></p>
  </main>
</body>
</html>
