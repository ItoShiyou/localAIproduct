<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ページが見つかりません</title>
  <!-- 404 は任意の階層で表示されるため、相対パスの CSS が使えない。ここだけ自己完結させる。 -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf7f0; color: #2b2622; font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.85; }
    main { max-width: 520px; padding: 24px; }
    h1 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 28px; line-height: 1.4; }
    a { color: #b8681c; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは、移動したか、まだ用意できていないようです。アドレスをご確認のうえ、トップからたどってみてください。</p>
    <p><a href="./">トップへ戻る</a></p>
  </main>
</body>
</html>
