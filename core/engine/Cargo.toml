[package]
name = "factory-core"
version = "0.1.0"
edition = "2021"
description = "ローカルAI買い切りアプリ共通コア(純ロジック部分)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
csv = "1"
encoding_rs = "0.8"
base64 = "0.22"
regex = "1"
ureq = { version = "2", features = ["json"] }

