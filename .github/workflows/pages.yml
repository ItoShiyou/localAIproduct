name: pages

# web/ の静的サイトを GitHub Pages に公開するワークフロー。
# 公開されるのは「main への push」または「手動実行(workflow_dispatch)」のときだけ。
# mac/verify への push は、サイトの組み立て(build)の確認のみで、公開(deploy)はしない。
on:
  workflow_dispatch:
  push:
    branches: [main, mac/verify]
    paths:
      - "web/**"
      - "core/brand/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Pages が未有効のリポジトリでも build だけは確認できるよう、失敗しても続行する
        continue-on-error: true
      - name: サイトを組み立てる(_site)
        run: |
          set -eu
          mkdir _site
          python3 web/minutes/check_site.py
          node --test web/minutes/bird-motion.test.mjs
          mkdir -p _site/minutes _site/assets
          cp web/minutes/index.html web/minutes/minutes.css web/minutes/brand.css web/minutes/bird.css web/minutes/beta.css web/minutes/screens.js web/minutes/motion.js web/minutes/bird.js _site/minutes/
          cp web/minutes/koyori.css web/minutes/koyori.js web/minutes/bird-motion.mjs _site/minutes/
          cp -R web/minutes/guide web/minutes/privacy web/minutes/beta-privacy web/minutes/licenses _site/minutes/
          cp -R web/minutes/character _site/minutes/
          cp web/assets/minutes-bird.png web/assets/minutes-bird-blink.png web/assets/minutes-bird-tilt.png web/assets/minutes-bird-wave.png web/assets/minutes-calm-reading.jpg web/assets/minutes-calm-edit.jpg web/assets/minutes-calm-minutes.jpg web/assets/minutes-calm-focus.jpg _site/assets/
          cp web/minutes-entry.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 公開は main への push か手動実行のときだけ(mac/verify では実行されない)
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
